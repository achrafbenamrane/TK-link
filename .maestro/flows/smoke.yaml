# Filet anti-crash : l'app démarre et affiche quelque chose de réel.
#
# Premier lancement (parcours du client) : bienvenue → compte (on continue sans
# compte) → centres d'intérêt → accueil. Un smoke test qui s'arrêterait à la
# bienvenue ne prouverait rien du reste de l'app.
#
# Run locally: npm run e2e:ios (requires `maestro` + a booted simulator with a
# development build installed).
appId: com.progix.tklink.dev
---
- launchApp:
    clearState: true

- assertVisible:
    id: 'welcome-screen'
- tapOn:
    id: 'welcome-skip'

# Compte : sans compte, on passe directement à la suite.
- assertVisible:
    id: 'sign-up-screen'
- tapOn:
    id: 'signup-skip'

# Centres d'intérêt, localisation, sécurisation : chaque écran se passe d'un geste.
- assertVisible:
    id: 'onboarding-screen'
- tapOn:
    id: 'interest-restauration'
- tapOn:
    id: 'onboarding-next'
- tapOn:
    id: 'onboarding-skip'
- tapOn:
    id: 'onboarding-skip'
- tapOn:
    id: 'onboarding-next'

# L'accueil : les ventes Flash, avec de vraies offres.
- assertVisible:
    id: 'home-screen'
- assertVisible:
    id: 'home-search'
