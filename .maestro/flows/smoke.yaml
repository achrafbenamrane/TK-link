# Filet anti-crash : l'app démarre et affiche quelque chose de réel.
#
# Le premier lancement passe par l'écran de bienvenue ; on le saute pour
# atterrir sur la personnalisation, puis on entre sans compte. Un smoke test
# qui s'arrêterait à la bienvenue ne prouverait rien du reste de l'app.
#
# Run locally: npm run e2e:ios (requires `maestro` + a booted simulator with a
# development build installed).
appId: com.progix.tklink.dev
---
- launchApp:
    clearState: true

- assertVisible:
    id: 'welcome-screen'
- tapOn:
    id: 'welcome-skip'

# Personnalisation — on prend le chemin le plus court jusqu'à l'app.
- assertVisible:
    id: 'onboarding-screen'
- tapOn:
    id: 'onboarding-next' # accroche → compte
- tapOn:
    id: 'onboarding-next' # « Continuer sans compte »
- tapOn:
    id: 'role-consommateur'
- tapOn:
    id: 'onboarding-next' # rôle → avatar
- tapOn:
    id: 'onboarding-next' # avatar → profil
- tapOn:
    id: 'onboarding-next' # profil → intérêts
- tapOn:
    id: 'onboarding-firstname'
- inputText: 'Sofiane'
- tapOn:
    id: 'interest-restauration'
- tapOn:
    id: 'onboarding-next'

# L'accueil : le déstockage, avec de vraies offres.
- assertVisible:
    id: 'home-screen'
- assertVisible:
    id: 'home-search'
