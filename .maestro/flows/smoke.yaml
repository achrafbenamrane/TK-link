# Filet anti-crash : l'app démarre et affiche quelque chose de réel.
#
# Premier lancement (ADR-0010 : le compte est obligatoire) : logo animé → choix du profil →
# l'inscription n'a plus de « Continuer sans compte ». Puis la démonstration ouvre une session
# locale, sans réseau, et entre dans l'app : le test ne dépend d'aucun serveur.
#
# Run locally: npm run e2e:ios (requires `maestro` + a booted simulator with a
# development build installed — le bouton « Démo » n'existe pas en production).
appId: com.progix.tklink.dev
---
# `clearState` n'efface pas le trousseau iOS, où la session de démonstration est rangée : sans
# `clearKeychain`, une seconde exécution démarrerait déjà connectée.
- clearKeychain
- launchApp:
    clearState: true

# Le logo animé, puis le choix du profil : sans compte, rien d'autre ne s'ouvre.
- assertVisible:
    id: 'welcome-screen'
- extendedWaitUntil:
    visible:
      id: 'role-screen'
    timeout: 15000

# Le compte est obligatoire : l'inscription ne propose plus de continuer sans lui.
- tapOn:
    id: 'role-consommateur'
- assertVisible:
    id: 'sign-up-screen'
- assertNotVisible:
    id: 'signup-skip'

# La démonstration : une session locale, puis l'accueil et ses ventes Flash.
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'role-screen'
    timeout: 15000
- tapOn:
    id: 'role-demo-consommateur'
- assertVisible:
    id: 'home-screen'
- assertVisible:
    id: 'home-search'
