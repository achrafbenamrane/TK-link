# CUJ-003 : la boucle du commerçant (docs/quality/critical-user-journeys.md)
#
# Un commerçant s'inscrit, crée un Flash (photo facultative, modes de remise),
# et retrouve ses commandes. L'appareil du commerçant s'ouvre sur la liste des
# commandes en cours (CDC V1.1) ; le tableau de bord est dans « Accueil ».
#
# `clearState` est obligatoire : le quota n'offre que cinq opérations gratuites.
appId: com.progix.tklink.dev
---
- launchApp:
    clearState: true

# Porte des commerçants : même inscription, variante professionnelle.
- openLink: 'tklink://commercant'
- assertVisible:
    id: 'sign-up-screen'
- tapOn:
    id: 'signup-firstname'
- inputText: 'Karim'
- tapOn:
    id: 'signup-lastname'
- inputText: 'Hammamet'
- tapOn:
    id: 'signup-email'
- inputText: 'karim@maison-hammamet.fr'
- tapOn:
    id: 'signup-phone'
- inputText: '0612345678'
- tapOn:
    id: 'signup-shopname'
- inputText: 'Maison Hammamet'
- hideKeyboard
- tapOn:
    id: 'signup-category-restauration'

# L'appareil s'ouvre sur les commandes en cours : écran de service.
- assertVisible:
    id: 'merchant-orders'
- assertVisible:
    id: 'merchant-orders-empty'

# Créer un Flash depuis l'onglet central.
- tapOn: 'Flash'
- tapOn:
    id: 'merchant-new-offer'
- tapOn:
    id: 'publish-title'
- inputText: 'Plateau de viennoiseries'
- tapOn:
    id: 'publish-old-price'
- inputText: '18'
- tapOn:
    id: 'publish-price'
- inputText: '9'
- tapOn:
    id: 'publish-stock'
- inputText: '6'
- hideKeyboard
- tapOn:
    id: 'publish-submit'
- tapOn: 'OK'
- assertVisible: 'Plateau de viennoiseries'
