<!doctype html>
<html lang="fr">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f5f8;
      font-family: Arial, Helvetica, sans-serif;
      color: #111114;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px"
    >
      <tr>
        <td style="padding: 28px 28px 8px">
          <p style="margin: 0; font-size: 22px; font-weight: 800">
            <span style="color: #ff1478">TK</span>link
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding: 8px 28px 28px">
          <p style="margin: 0 0 12px; font-size: 16px">Bienvenue sur TK LINK !</p>
          <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #4b4b57">
            Pour confirmer votre adresse e-mail, saisissez ce code dans l’application :
          </p>
          <p
            style="
              margin: 0 0 20px;
              font-size: 32px;
              font-weight: 800;
              letter-spacing: 8px;
              text-align: center;
            "
          >
            {{ .Token }}
          </p>
          <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #6c6c7a">
            Ce code expire dans 1 heure. Si vous n’avez pas créé de compte TK LINK, ignorez ce
            message.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
