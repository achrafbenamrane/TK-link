# Supabase CLI config (template). Run `supabase init` to regenerate the full
# file for your environment; the security-relevant override is below.
project_id = "expo-skeleton"

[functions.revenuecat-webhook]
# The webhook carries no Supabase JWT — it authenticates with a shared secret
# header that the function verifies itself. Do NOT enable verify_jwt here.
verify_jwt = false

[functions.delete-account]
# Called by a signed-in user — require a valid Supabase JWT (the default).
verify_jwt = true

# ─────────────────────────────────────────────────────────────── authentification
#
# Ce que l'app attend du serveur (voir docs/security/authentication.md) :
#   - e-mail + mot de passe, avec confirmation par CODE à six chiffres ;
#   - téléphone + mot de passe, confirmé par SMS (fournisseur à brancher) ;
#   - Google et Apple par jeton d'identité natif (pas de redirection).
#
# Ces réglages servent à la base LOCALE (`supabase start`) et peuvent être poussés vers le projet
# hébergé avec `supabase config push`. Sur le projet hébergé, ils se règlent aussi dans le tableau
# de bord (Authentication) : c'est le chemin décrit dans la doc. Les secrets ne sont JAMAIS écrits
# ici : `env(...)` les lit dans l'environnement de la machine qui lance la commande.

[auth]
enabled = true
# Adresse du site TK LINK — sert de lien de repli dans les e-mails. À remplacer par le vrai domaine.
site_url = "https://tklink.fr"
# Le schéma de l'app : seul retour autorisé si un jour un lien (et non un code) est utilisé.
additional_redirect_urls = ["tklink://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Aligné sur l'app (MIN_PASSWORD) : 8 caractères, sans règle de composition (NIST SP 800-63B).
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
# Envois d'e-mails et de SMS par heure : protège le budget SMS et la réputation d'envoi.
email_sent = 30
sms_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# L'adresse est confirmée par le code reçu (l'app le demande juste après l'inscription).
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Votre code TK LINK"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Changer votre mot de passe TK LINK"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
# Téléphone + mot de passe, confirmé par SMS.
enable_signup = true
enable_confirmations = true
template = "TK LINK : votre code est {{ .Code }}. Il expire dans 1 heure."
max_frequency = "60s"

# Fournisseur de SMS : sans lui, aucun code ne part (l'app le dit, et propose l'e-mail).
# Twilio est le plus courant ; renseigner les identifiants, puis passer `enabled` à true.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Numéros de TEST (développement) : aucun SMS n'est envoyé, le code est fixe.
[auth.sms.test_otp]
33600000001 = "123456"

# Google — jeton d'identité natif. `client_id` : l'identifiant « Web » EN PREMIER, puis ceux
# d'Android et d'iOS, séparés par des virgules. Le secret est celui du client « Web ».
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Apple — jeton d'identité natif (iOS). `client_id` : les identifiants de bundle de l'app, séparés
# par des virgules (com.progix.tklink, com.progix.tklink.preview, com.progix.tklink.dev). Pas de
# secret nécessaire pour le parcours natif seul.
[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
skip_nonce_check = false
