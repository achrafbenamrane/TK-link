# Supabase CLI config (template). Run `supabase init` to regenerate the full
# file for your environment; the security-relevant override is below.
project_id = "expo-skeleton"

[functions.revenuecat-webhook]
# The webhook carries no Supabase JWT — it authenticates with a shared secret
# header that the function verifies itself. Do NOT enable verify_jwt here.
verify_jwt = false

# Les deux fonctions ci-dessous sont appelées par un compte CONNECTÉ et vérifient elles-mêmes
# l'appelant (`auth.getUser()` avec son jeton → 401 sinon). La vérification de la plateforme
# (« Verify JWT with legacy secret ») ne reconnaît que les jetons signés par l'ANCIEN secret : sur un
# projet qui signe avec les nouvelles clés JWT, elle refuserait tout le monde. Supabase la
# recommande désactivée quand la fonction fait sa propre vérification — c'est le cas.
[functions.delete-account]
verify_jwt = false

[functions.link-phone]
# Associe un numéro au compte connecté (sans code, avant Prelude).
verify_jwt = false

# Uber Direct (13/11/2026, à la place des livreurs TK LINK). Devis et course : appelés par un compte
# connecté, vérifié dans la fonction (même raison que ci-dessus). Webhook : appelé par Uber, sans
# jeton Supabase — authentifié par sa signature HMAC (secret UBER_WEBHOOK_SIGNING_KEY).
[functions.uber-quote]
verify_jwt = false

[functions.uber-dispatch]
verify_jwt = false

[functions.uber-cancel]
verify_jwt = false

[functions.uber-webhook]
verify_jwt = false

# Stripe Connect (CDC V1.1, « Direct charges »). Inscription du commerçant et paiement : appelés par
# un compte connecté, vérifié dans la fonction. Webhook : appelé par Stripe, authentifié par
# l'en-tête Stripe-Signature (secret STRIPE_WEBHOOK_SECRET).
[functions.stripe-connect]
verify_jwt = false

[functions.stripe-balance]
verify_jwt = false

[functions.stripe-payment]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Visuels IA des commerces (fal.ai) : appelés par un commerçant connecté, vérifié dans la fonction.
[functions.ai-media-start]
verify_jwt = false

[functions.ai-media-status]
verify_jwt = false

# Notifications : appelée par les Database Webhooks de Supabase, authentifiée par l'en-tête
# x-webhook-secret (secret PUSH_WEBHOOK_SECRET).
[functions.push-events]
verify_jwt = false

# ─────────────────────────────────────────────────────────────── authentification
#
# Ce que l'app attend du serveur (voir docs/security/authentication.md, ADR-0010) :
#   - un compte OBLIGATOIRE pour entrer dans l'app ;
#   - e-mail + mot de passe, avec confirmation par CODE à six chiffres, envoyé par Resend ;
#   - téléphone + mot de passe, SANS SMS pour l'instant : le numéro est associé par la fonction
#     Edge `link-phone` (la vérification par SMS viendra avec Prelude) ;
#   - Google par jeton natif ; Apple par jeton natif sur iPhone, par sa page web (PKCE) sur Android.
#
# Ces réglages servent à la base LOCALE (`supabase start`). Le projet HÉBERGÉ se règle dans le
# tableau de bord (Authentication) — c'est le chemin décrit dans la doc. Ne PAS y pousser la section
# `[auth]` avec `supabase config push` : la CLI coupe la connexion par téléphone faute de
# fournisseur de SMS, inverse `enable_confirmations` (voir `[auth.sms]`), et une section SMTP
# désactivée effacerait celle de Resend. Les secrets ne sont JAMAIS écrits ici : `env(...)` les lit
# dans l'environnement de la machine qui lance la commande.

[auth]
enabled = true
# Adresse du site TK LINK — sert de lien de repli dans les e-mails. À remplacer par le vrai domaine.
site_url = "https://tklink.fr"
# Le SEUL retour autorisé : Apple sur Android (page web d'Apple, PKCE) revient ici. Entrée EXACTE —
# « tklink:// » seul ne couvre pas « tklink://auth/callback », et Supabase renverrait alors sans rien
# dire vers site_url : l'onglet ne reviendrait jamais à l'app.
additional_redirect_urls = ["tklink://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Aligné sur l'app (MIN_PASSWORD) : 8 caractères, sans règle de composition (NIST SP 800-63B).
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
# Envois d'e-mails et de SMS par heure : protège le budget et la réputation d'envoi. `email_sent` ne
# vaut qu'avec un SMTP personnalisé (Resend) : sans lui, Supabase plafonne à 2 e-mails par heure,
# réservés aux membres de l'équipe. À relever dans le tableau de bord (Authentication → Rate Limits)
# une fois Resend branché — sans dépasser le quota du forfait Resend (gratuit : 100 par jour).
email_sent = 30
sms_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

# L'envoi des e-mails passe par Resend (SMTP), réglé dans le tableau de bord du projet HÉBERGÉ
# (Authentication → Emails → SMTP Settings, ou l'intégration « Connect to Supabase » de Resend). Il
# n'est volontairement PAS décrit ici : activé, `supabase start` enverrait de vrais e-mails au lieu de
# Mailpit ; désactivé, un `config push` effacerait le réglage hébergé. Pour le pousser malgré tout,
# le mettre dans un bloc `[remotes.production]` (project_id = la référence du projet hébergé) :
#
#   [remotes.production.auth.email.smtp]
#   enabled = true
#   host = "smtp.resend.com"
#   port = 465
#   user = "resend"
#   pass = "env(SUPABASE_AUTH_EMAIL_SMTP_PASS)"   # clé Resend « Sending access »
#   admin_email = "no-reply@auth.<domaine vérifié>"
#   sender_name = "TK LINK"

[auth.email]
enable_signup = true
double_confirm_changes = true
# L'adresse est confirmée par le code reçu (l'app le demande juste après l'inscription).
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Votre code TK LINK"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Changer votre mot de passe TK LINK"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
# Téléphone + mot de passe, SANS SMS pour l'instant : le numéro est associé (et confirmé côté Auth)
# par la fonction Edge `link-phone`, puis sert à se connecter avec le même mot de passe.
#
# Projet hébergé — dans le tableau de bord, PAS avec `config push` :
#   1. Authentication → Hooks → « Send SMS » → Postgres → `public.send_sms_disabled` (refuse tout
#      envoi : plus d'inscription par téléphone, plus de numéro changé sans preuve) ;
#   2. Authentication → Providers → Phone → activé, « Enable phone confirmations » ACTIVÉ.
# Pourquoi pas la CLI : sans fournisseur de SMS ici, elle coupe la connexion par téléphone ; et elle
# envoie `enable_confirmations` tel quel dans `sms_autoconfirm`, c'est-à-dire À L'ENVERS.
#
# Pas de numéros de test (`[auth.sms.test_otp]`) : ils contournent le crochet, donc permettraient de
# créer un compte par téléphone.
#
# En LOCAL (`supabase start`), la connexion par numéro est donc coupée par la CLI : pour la tester,
# ajouter un bloc `[auth.sms.twilio]` factice avec `enabled = true` (le crochet empêche tout envoi).
enable_signup = true
enable_confirmations = true
template = "TK LINK : votre code est {{ .Code }}. Il expire dans 1 heure."
max_frequency = "60s"

# Aucun SMS avant Prelude (migration 0008). Avec Prelude, ce crochet pointera vers son adresse HTTPS.
[auth.hook.send_sms]
enabled = true
uri = "pg-functions://postgres/public/send_sms_disabled"

# Google — jeton d'identité natif. `client_id` : l'identifiant « Web » EN PREMIER, puis ceux
# d'Android et d'iOS, séparés par des virgules. Le secret est celui du client « Web ».
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Apple — deux parcours, un seul compte (l'identifiant Apple est le même pour toute l'équipe Progix) :
#   - iPhone : jeton d'identité natif ; tout identifiant de la liste est accepté ;
#   - Android : la page web d'Apple (OAuth + PKCE, retour sur tklink://auth/callback). Elle utilise le
#     PREMIER identifiant — le Services ID — et EXIGE le secret : un JWT ES256 signé avec la clé .p8
#     d'Apple, valable 6 mois au plus. À renouveler avant l'échéance, sinon Apple échoue sur Android.
# `client_id` : com.progix.tklink.web,com.progix.tklink,com.progix.tklink.preview,com.progix.tklink.dev
# (le Services ID EN PREMIER). Procédure complète : docs/security/authentication.md.
[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
skip_nonce_check = false
